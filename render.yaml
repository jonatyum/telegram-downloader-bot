services:
  - type: web
    name: telegram-downloader-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Health check: PTB responde en el path del webhook; Render solo necesita
    # que el puerto esté abierto para considerar el servicio "vivo".
    envVars:
      # Token del bot de @BotFather
      - key: BOT_TOKEN
        sync: false
      # Connection string del pooler de Supabase (Transaction mode, puerto 6543)
      - key: DATABASE_URL
        sync: false
      # Chat ID del administrador (opcional)
      - key: ADMIN_CHAT_ID
        sync: false
      # Token secreto opcional para validar los webhooks de Telegram
      - key: WEBHOOK_SECRET
        sync: false
      # URL pública del frontend. El bot la ofrece cuando un video pasa su límite
      # de tamaño, porque la web no tiene el tope de 50 MB del Bot API.
      - key: WEB_URL
        value: "https://downloader.jonatyum.com"
      # --- Límites conservadores para los 512 MB de RAM del plan free ---
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_COMPRESS_HEIGHT
        value: "720"
      - key: MAX_PREFLIGHT_SIZE_MB
        value: "50"
      - key: MAX_DOCUMENT_SIZE_MB
        value: "50"
    # RENDER_EXTERNAL_URL la inyecta Render automáticamente y el bot la usa como
    # WEBHOOK_URL, así que no hace falta configurarla a mano.

  # Servicio separado para el canal web (frontend estático en GitHub Pages, este
  # servicio es solo la API). No comparte proceso con el bot: así un pico de tráfico
  # público en la web no puede tumbar el bot de Telegram, y viceversa. No necesita
  # BOT_TOKEN ni DATABASE_URL — api.py no importa nada de Telegram ni de la BD.
      # Ruta del Secret File con las cookies de YouTube. El archivo NO se define acá:
      # subilo en el dashboard (Environment -> Secret Files) con este mismo nombre.
      # Si no existe, el servicio arranca igual y sigue sin cookies (solo YouTube se ve
      # afectado; TikTok, Instagram, Facebook y X no necesitan esto).
      - key: YOUTUBE_COOKIES_FILE
        value: "/etc/secrets/youtube-cookies.txt"
      # Clientes de InnerTube que yt-dlp prueba en YouTube. El chequeo antibot desde
      # IPs de datacenter no cae igual sobre todos: los de TV y visores VR a veces
      # siguen contestando. Se puede ajustar acá sin tocar código.
      - key: YOUTUBE_PLAYER_CLIENTS
        value: "default,tv_simply,android_vr"
      # Proxy SOLO para YouTube. Vacío = sin proxy (comportamiento actual). Es lo único
      # que resuelve el bloqueo por reputación de IP sin cookies, pero se paga por GB:
      # cargalo en el dashboard cuando tengas uno, no en el repo (lleva credenciales).
      - key: YOUTUBE_PROXY
        sync: false
      # Worker remoto en una conexión residencial (worker.py detrás de un túnel).
      # Es lo único que resuelve el bloqueo de YouTube sin cookies ni proxy pago.
      # Vacío = sin worker; si está configurado pero no responde, el servicio sigue
      # resolviendo en local, así que apagar esa máquina no rompe nada.
      - key: YOUTUBE_WORKER_URL
        sync: false
      - key: YOUTUBE_WORKER_TOKEN
        sync: false
  - type: web
    name: telegram-downloader-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    # A diferencia del bot (que no expone un path de salud propio), api.py sí tiene
    # /health: Render espera un 200 ahí antes de cortar el tráfico al deploy anterior.
    healthCheckPath: /health
    envVars:
      # Orígenes permitidos por CORS, separados por coma. SIN barra final y SIN ruta:
      # el navegador manda el Origin como esquema+host+puerto ("https://ejemplo.com"),
      # y la comparación de CORSMiddleware es exacta — una "/" de más y la petición
      # se rechaza, que desde el JS se ve igual que "no hay servidor".
      # El dominio propio es el que sirve hoy; se deja también el de GitHub Pages por
      # si alguna vez se quita el dominio y vuelve a ser el origen real.
      - key: WEB_ORIGINS
        value: "https://downloader.jonatyum.com,https://jonatyum.github.io"
      # --- Mismos límites conservadores que el bot, mismo motivo: 512 MB de RAM ---
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_COMPRESS_HEIGHT
        value: "720"
      # 2000 MB (no 500): la web ahora ofrece hasta 4K, y 500 MB rechazaba de entrada
      # cualquier video largo en esa calidad antes de que llegara al usuario. Si el
      # disco del plan free de Render no aguanta esto en la práctica, bajalo — es la
      # única señal real de cuánto espacio hay disponible.
      - key: MAX_DOCUMENT_SIZE_MB
        value: "2000"
      # Cuántos minutos vive un resultado en disco antes de que el barrido lo borre.
      - key: JOB_TTL_MINUTES
        value: "30"
      # Ruta del Secret File con las cookies de YouTube. El archivo NO se define acá:
      # subilo en el dashboard (Environment -> Secret Files) con este mismo nombre.
      # Si no existe, el servicio arranca igual y sigue sin cookies (solo YouTube se ve
      # afectado; TikTok, Instagram, Facebook y X no necesitan esto).
      - key: YOUTUBE_COOKIES_FILE
        value: "/etc/secrets/youtube-cookies.txt"
      # Clientes de InnerTube que yt-dlp prueba en YouTube. El chequeo antibot desde
      # IPs de datacenter no cae igual sobre todos: los de TV y visores VR a veces
      # siguen contestando. Se puede ajustar acá sin tocar código.
      - key: YOUTUBE_PLAYER_CLIENTS
        value: "default,tv_simply,android_vr"
      # Proxy SOLO para YouTube. Vacío = sin proxy (comportamiento actual). Es lo único
      # que resuelve el bloqueo por reputación de IP sin cookies, pero se paga por GB:
      # cargalo en el dashboard cuando tengas uno, no en el repo (lleva credenciales).
      - key: YOUTUBE_PROXY
        sync: false
      # Worker remoto en una conexión residencial (worker.py detrás de un túnel).
      # Es lo único que resuelve el bloqueo de YouTube sin cookies ni proxy pago.
      # Vacío = sin worker; si está configurado pero no responde, el servicio sigue
      # resolviendo en local, así que apagar esa máquina no rompe nada.
      - key: YOUTUBE_WORKER_URL
        sync: false
      - key: YOUTUBE_WORKER_TOKEN
        sync: false
