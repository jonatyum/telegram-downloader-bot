services:
  - type: web
    name: telegram-downloader-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Health check: PTB responde en el path del webhook; Render solo necesita
    # que el puerto esté abierto para considerar el servicio "vivo".
    envVars:
      # Token del bot de @BotFather
      - key: BOT_TOKEN
        sync: false
      # Connection string del pooler de Supabase (Transaction mode, puerto 6543)
      - key: DATABASE_URL
        sync: false
      # Chat ID del administrador (opcional)
      - key: ADMIN_CHAT_ID
        sync: false
      # Token secreto opcional para validar los webhooks de Telegram
      - key: WEBHOOK_SECRET
        sync: false
      # --- Límites conservadores para los 512 MB de RAM del plan free ---
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_COMPRESS_HEIGHT
        value: "720"
      - key: MAX_PREFLIGHT_SIZE_MB
        value: "50"
      - key: MAX_DOCUMENT_SIZE_MB
        value: "50"
    # RENDER_EXTERNAL_URL la inyecta Render automáticamente y el bot la usa como
    # WEBHOOK_URL, así que no hace falta configurarla a mano.

  # Servicio separado para el canal web (frontend estático en GitHub Pages, este
  # servicio es solo la API). No comparte proceso con el bot: así un pico de tráfico
  # público en la web no puede tumbar el bot de Telegram, y viceversa. No necesita
  # BOT_TOKEN ni DATABASE_URL — api.py no importa nada de Telegram ni de la BD.
  - type: web
    name: telegram-downloader-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    # A diferencia del bot (que no expone un path de salud propio), api.py sí tiene
    # /health: Render espera un 200 ahí antes de cortar el tráfico al deploy anterior.
    healthCheckPath: /health
    envVars:
      # URL del frontend en GitHub Pages, para el header CORS. Con varios orígenes
      # (p. ej. dominio propio + *.github.io), sepáralos por coma.
      - key: WEB_ORIGINS
        value: "https://jonatyum.github.io"
      # --- Mismos límites conservadores que el bot, mismo motivo: 512 MB de RAM ---
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_COMPRESS_HEIGHT
        value: "720"
      # 2000 MB (no 500): la web ahora ofrece hasta 4K, y 500 MB rechazaba de entrada
      # cualquier video largo en esa calidad antes de que llegara al usuario. Si el
      # disco del plan free de Render no aguanta esto en la práctica, bajalo — es la
      # única señal real de cuánto espacio hay disponible.
      - key: MAX_DOCUMENT_SIZE_MB
        value: "2000"
      # Cuántos minutos vive un resultado en disco antes de que el barrido lo borre.
      - key: JOB_TTL_MINUTES
        value: "30"
